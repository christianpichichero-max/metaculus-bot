name: Daily resolution report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # daily 12:00 UTC (8am Nassau)

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pull accumulated logs from data branch
        run: |
          git fetch origin data || { echo "no data branch yet"; exit 0; }
          mkdir -p data
          for f in forecasts.jsonl supervisor.jsonl failed.jsonl forecasts_structured.jsonl blf.jsonl calib.jsonl; do
            git show "origin/data:$f" > "data/$f" 2>/dev/null || rm -f "data/$f"
          done
      # DEAD-MAN SWITCH: the bot's failures are 'green' (per-question exceptions are
      # swallowed by design), so watch the heartbeat instead: if no NEW forecast has
      # been logged in >= 30h, something upstream is dead (credits, token, SDK).
      - name: Dead-man switch (stale-forecast alarm)
        env:
          GH_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          set +e
          [ -s data/forecasts.jsonl ] || { echo "no log yet — skip"; exit 0; }
          # Drought guard: silence is only alarming if there are questions TO forecast.
          OPEN=$(python - <<'PY'
          import os
          try:
              from forecasting_tools import MetaculusClient
              c = MetaculusClient()
              n = len(c.get_all_open_questions_from_tournament(c.CURRENT_AI_COMPETITION_ID)) \
                + len(c.get_all_open_questions_from_tournament(c.CURRENT_MINIBENCH_ID))
              print(n)
          except Exception:
              print(-1)  # unknown → don't suppress the alarm
          PY
          )
          echo "open questions right now (SDK fetch): $OPEN"
          AGE_H=$(python - <<'PY'
          import json, datetime
          latest = None
          for line in open('data/forecasts.jsonl'):
              try:
                  t = json.loads(line).get('logged_at')
                  if t: latest = max(latest or t, t)
              except Exception: pass
          if latest is None:
              print(9999)
          else:
              dt = datetime.datetime.fromisoformat(latest.replace('Z','+00:00'))
              print(round((datetime.datetime.now(datetime.timezone.utc)-dt).total_seconds()/3600))
          PY
          )
          echo "hours since last logged forecast: $AGE_H"
          # FAILURE LEDGER: the bot writes data/failed.jsonl for every question that failed
          # both passes. 683 such entries piled up unread during a month-long outage — so
          # now any burst of recent failures raises its own alarm, with the error text.
          FAILS48=$(python - <<'PY3'
          import json, datetime, os
          cutoff = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=48)).isoformat()
          n = 0; last = ""
          if os.path.exists("data/failed.jsonl"):
              for line in open("data/failed.jsonl"):
                  try:
                      r = json.loads(line)
                      if (r.get("at") or "") >= cutoff:
                          n += 1; last = (r.get("error") or "")[:400]
                  except Exception: pass
          print(n); print(last)
          PY3
          )
          FAILN=$(echo "$FAILS48" | head -1); FAILMSG=$(echo "$FAILS48" | tail -n +2)
          echo "question failures in last 48h: $FAILN"
          if [ "${FAILN:-0}" -ge 3 ]; then
            if [ -z "$(gh issue list --state open --search 'FORECAST FAILURES in:title' --json number -q '.[0]' 2>/dev/null)" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "FORECAST FAILURES: $FAILN question(s) failed in the last 48h" \
                --body "@christianpichichero-max questions are being fetched but forecasts are FAILING. Last error: \`$FAILMSG\`" \
                || echo "failure issue creation failed (non-fatal)"
            else
              echo "failure issue already open — not duplicating"
            fi
          fi
          # Independent signal (raw API, NO type filter — the SDK filter is exactly what
          # went blind for a month): were any bot-tournament posts published in the last 48h?
          NEWPOSTS=$(python - <<'PY2'
          import os, requests, datetime
          tok = os.getenv("METACULUS_TOKEN", "")
          cutoff = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=48)).strftime("%Y-%m-%dT%H:%M:%S")
          total = 0
          for t in ("minibench", "33022"):
              try:
                  r = requests.get("https://www.metaculus.com/api/posts/", headers={"Authorization": f"Token {tok}"},
                                   params={"tournaments": t, "limit": 100, "published_at__gt": cutoff}, timeout=30)
                  total += len((r.json() or {}).get("results") or [])
              except Exception:
                  total = -1; break
          print(total)
          PY2
          )
          echo "bot-tournament posts published in last 48h (raw API): $NEWPOSTS"
          if [ "$OPEN" = "0" ] && [ "$NEWPOSTS" = "0" ]; then echo "genuine question drought — no alarm"; exit 0; fi
          if [ "$NEWPOSTS" != "0" ] && [ "$AGE_H" -ge 30 ]; then echo "::warning::questions were published but nothing was forecast — fetch may be blind"; fi
          if [ "$AGE_H" -ge 30 ]; then
            if [ -z "$(gh issue list --state open --search 'DEAD-MAN in:title' --json number -q '.[0]' 2>/dev/null)" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "DEAD-MAN: no new forecast logged in ${AGE_H}h" \
                --body "@christianpichichero-max the bot has not logged a new forecast in ${AGE_H} hours. Likely causes: OpenRouter credits exhausted, Metaculus token expired, SDK breakage, or simply no open questions for an extended stretch. Check the Actions runs: https://github.com/${GITHUB_REPOSITORY}/actions" \
                || echo "dead-man issue creation failed (non-fatal)"
            else
              echo "dead-man issue already open — not duplicating"
            fi
          fi
      - name: Run resolution + shadow-A/B report
        shell: bash
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          set -o pipefail
          python resolve.py | tee report.txt || echo "::warning::resolve.py reported incomplete/failed fetches — report may under-count"
      - name: Publish report (push FIRST, then raise the news issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          COUNT=$(grep -oE "RESOLVED binary: [0-9]+" report.txt | grep -oE "[0-9]+" | head -1 || true)
          COUNT=${COUNT:-0}
          LAST=$(git show origin/data:last_reported_count 2>/dev/null || echo 0)
          echo "resolved now: $COUNT | last reported: $LAST"
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.email "bot@users.noreply.github.com"
          git config --global user.name "chrispbacon-bot"
          PUSHED=0
          for attempt in 1 2 3; do
            D="$(mktemp -d)"
            git clone --quiet --depth 1 --branch data "$REPO" "$D" || { sleep $((attempt*5)); continue; }
            cp report.txt "$D/report.txt"
            [ -f data/resolved.jsonl ] && cp data/resolved.jsonl "$D/resolved.jsonl"
            if [ "$COUNT" -gt "$LAST" ]; then
              echo "$COUNT" > "$D/last_reported_count"
              { printf 'date: %s\nresolved: %s (was %s)\n\n' "$(date -u +%FT%TZ)" "$COUNT" "$LAST"; cat report.txt; } > "$D/NEWS.md"
            fi
            if ( cd "$D" && git add -A && git commit --quiet -m "daily report $(date -u +%FT%TZ)" && git push --quiet origin data ); then
              PUSHED=1; echo "report pushed (attempt $attempt)"; break
            fi
            echo "push rejected (attempt $attempt) — re-cloning..."; sleep $((attempt*5))
          done
          # Issue ONLY after a successful push: otherwise last_reported_count is lost
          # and tomorrow's run would mint a duplicate news issue.
          if [ "$PUSHED" = "1" ] && [ "$COUNT" -gt "$LAST" ]; then
            { printf '@christianpichichero-max new resolutions just landed. Report:\n\n```\n'; cat report.txt; printf '```\n\nLeaderboard: https://www.metaculus.com/tournament/summer-futureeval-2026/\nProfile: https://www.metaculus.com/accounts/profile/303904/\n'; } > /tmp/issue_body.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Chrispbacon-bot: $COUNT resolved question(s) - new scores are in" --body-file /tmp/issue_body.md || echo "issue creation failed (non-fatal)"
          fi
          [ "$PUSHED" = "1" ] || echo "::warning::report push FAILED after 3 attempts"
